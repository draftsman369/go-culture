<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go CULTURE prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div class="stage">
  <div class="persona" role="group" aria-label="Choisir le persona">

    <button data-persona="rene" aria-pressed="false">René, 65 ans · mode simple</button>

  <div class="phone" id="phone">

    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
    <div class="toast" id="toast" role="status"></div>
    <div id="sheet"></div>
  </div>
  <p class="note" id="note">Prototype cliquable · données d'exemple</p>
</div>
